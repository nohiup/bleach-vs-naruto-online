services:
  - type: web
    name: bvn-relay
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ROOM_PASSWORD
        sync: false
