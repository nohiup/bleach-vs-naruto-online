app = "bvn-relay"
primary_region = "nrt"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  # set ALLOWED_ORIGIN to your site, e.g. https://bvn.pages.dev (comma list); ROOM_PASSWORD via `fly secrets set`
  ALLOWED_ORIGIN = "https://your.site"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
